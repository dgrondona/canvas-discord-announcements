name: Lab Threads

on:
  # Every 30 minutes - assignments change far less often than announcements.
  # Offset from the announcements cron (3,18,33,48) so the two workflows aren't
  # pushing their state commits at the same moment.
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:
    inputs:
      preview:
        description: "Post a throwaway thread to check formatting: sample = made up, real = an actual lab"
        type: choice
        options:
          - "off"
          - sample
          - real
        default: "off"
      preview_lab:
        description: "Which lab to preview (name or assignment id, e.g. 'Lab 1'). Empty = earliest due."
        type: string
        default: ""
      dry_run:
        description: "List what would happen without posting anything"
        type: boolean
        default: false
      backfill:
        description: "Create threads for labs that were recorded but never threaded"
        type: boolean
        default: false
      verbose:
        description: "Log assignment names (note: Actions logs are public on a public repo)"
        type: boolean
        default: false

concurrency:
  group: canvas-labs
  cancel-in-progress: false

jobs:
  labs:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync lab threads
        env:
          CANVAS_URL: ${{ secrets.CANVAS_URL || vars.CANVAS_URL || 'https://canvas.ucmerced.edu' }}
          CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
          COURSE_ID: ${{ secrets.COURSE_ID || vars.COURSE_ID }}
          # A webhook is bound to one channel, so this is a second webhook,
          # created on the forum channel - not the announcements one.
          DISCORD_FORUM_WEBHOOK_URL: ${{ secrets.DISCORD_FORUM_WEBHOOK_URL }}
          DISCORD_LAB_MENTION: ${{ secrets.DISCORD_LAB_MENTION || vars.DISCORD_LAB_MENTION }}
          LAB_PATTERN: ${{ vars.LAB_PATTERN }}
          LAB_FORUM_TAGS: ${{ vars.LAB_FORUM_TAGS }}
          PREVIEW: ${{ inputs.preview }}
          PREVIEW_LAB: ${{ inputs.preview_lab }}
          DRY_RUN: ${{ inputs.dry_run }}
          BACKFILL: ${{ inputs.backfill }}
          VERBOSE: ${{ inputs.verbose }}
        run: python canvas_labs.py

      - name: Commit lab thread state
        # always(), so threads that were created are still recorded when a later
        # one fails - otherwise the next run would create them a second time.
        if: always()
        run: |
          set -euo pipefail

          if [ ! -f lab_threads.json ]; then
            echo "No state file was written; nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lab_threads.json

          if git diff --cached --quiet; then
            echo "Lab thread state unchanged."
            exit 0
          fi

          git commit -m "Update lab thread state [skip ci]"

          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed lab thread state."
              exit 0
            fi
            echo "Push failed (attempt ${attempt}); rebasing onto origin and retrying."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          done

          echo "Could not push lab thread state after 3 attempts." >&2
          exit 1
